name: Sync official FPL data
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official FPL data
        env:
          TEAM_ID: '702959'
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          curl -fsSL --retry 4 --retry-delay 2 -A "$UA" -H 'Accept: application/json' -H 'Referer: https://fantasy.premierleague.com/' 'https://fantasy.premierleague.com/api/bootstrap-static/' -o /tmp/bootstrap.json
          python - <<'PY2'
          import json
          d=json.load(open('/tmp/bootstrap.json'))
          assert 'elements' in d and 'events' in d
          PY2
          GW=$(python - <<'PY2'
          import json
          d=json.load(open('/tmp/bootstrap.json'))
          e=next((x for x in d['events'] if x.get('is_current')), None) or next((x for x in d['events'] if x.get('is_next')), None) or d['events'][0]
          print(e['id'])
          PY2
          )
          curl -fsSL --retry 4 -A "$UA" -H 'Accept: application/json' -H 'Referer: https://fantasy.premierleague.com/' "https://fantasy.premierleague.com/api/entry/$TEAM_ID/" -o /tmp/entry.json
          curl -fsSL --retry 4 -A "$UA" -H 'Accept: application/json' -H 'Referer: https://fantasy.premierleague.com/' "https://fantasy.premierleague.com/api/entry/$TEAM_ID/history/" -o /tmp/history.json
          curl -fsSL --retry 4 -A "$UA" -H 'Accept: application/json' -H 'Referer: https://fantasy.premierleague.com/' "https://fantasy.premierleague.com/api/entry/$TEAM_ID/transfers/" -o /tmp/transfers.json
          curl -fsSL --retry 4 -A "$UA" -H 'Accept: application/json' -H 'Referer: https://fantasy.premierleague.com/' "https://fantasy.premierleague.com/api/entry/$TEAM_ID/event/$GW/picks/" -o /tmp/picks.json
      - name: Publish snapshot to fpl-cache branch
        run: |
          set -euo pipefail
          git config user.name 'fpl-edge-sync[bot]'
          git config user.email 'fpl-edge-sync[bot]@users.noreply.github.com'
          git fetch origin fpl-cache:fpl-cache || true
          git switch fpl-cache 2>/dev/null || git switch --orphan fpl-cache
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p data
          python - <<'PY2'
          import json,datetime
          out={'bootstrap':json.load(open('/tmp/bootstrap.json')),'entry':json.load(open('/tmp/entry.json')),'history':json.load(open('/tmp/history.json')),'transfers':json.load(open('/tmp/transfers.json')),'picks':json.load(open('/tmp/picks.json')),'synced_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'team_id':702959}
          json.dump(out,open('data/live.json','w'),separators=(',',':'))
          PY2
          git add data/live.json
          git commit -m 'chore: sync official FPL data' || exit 0
          git push -u origin fpl-cache

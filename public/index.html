<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<title>FPL Edge</title>

<style>
:root{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#0b1020;
  color:#f4f6fb
}

*{box-sizing:border-box}

body{
  margin:0;
  background:#0b1020;
  color:#f4f6fb
}

.wrap{
  max-width:1400px;
  margin:auto;
  padding:18px
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap
}

.logo{
  font-size:27px;
  font-weight:900
}

.muted{
  color:#9da7bc
}

.tabs{
  display:flex;
  gap:8px;
  overflow:auto;
  margin:18px 0
}

.btn{
  border:1px solid #303a52;
  background:#151d31;
  color:#fff;
  border-radius:10px;
  padding:9px 12px;
  cursor:pointer
}

.btn.active{
  background:#fff;
  color:#101522
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px
}

.card{
  background:#121a2b;
  border:1px solid #27324a;
  border-radius:14px;
  padding:15px
}

.wide{
  grid-column:1/-1
}

.label{
  font-size:12px;
  color:#8e9ab2;
  text-transform:uppercase;
  letter-spacing:.08em
}

.big{
  font-size:24px;
  font-weight:800;
  margin-top:5px
}

.scroll{
  overflow:auto
}

table{
  width:100%;
  border-collapse:collapse
}

th,td{
  text-align:left;
  padding:9px;
  border-bottom:1px solid #27324a;
  white-space:nowrap;
  font-size:13px
}

.pill{
  padding:3px 7px;
  border-radius:999px;
  background:#24304a;
  display:inline-block;
  margin:2px
}

.good{
  color:#7ee2a8
}

.bad{
  color:#ff8d9d
}

.warn{
  color:#ffd36e
}

.row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:9px 0;
  border-bottom:1px solid #27324a
}

.hero{
  font-size:21px;
  font-weight:800
}

.footer{
  margin:20px 0;
  color:#75809a;
  font-size:12px
}

.error{
  border:1px solid #6b3440;
  background:#24141a
}

.ok{
  border:1px solid #285d46;
  background:#12251d
}

.loading{
  padding:30px;
  text-align:center
}

.small{
  font-size:12px
}

.link{
  color:#9bc4ff;
  text-decoration:none
}

.link:hover{
  text-decoration:underline
}

.fixture{
  display:inline-flex;
  align-items:center;
  gap:5px;
  margin:2px 4px 2px 0;
  padding:5px 7px;
  background:#202a41;
  border-radius:8px
}

.fdr1,.fdr2{
  border-left:3px solid #4fd18b
}

.fdr3{
  border-left:3px solid #9da7bc
}

.fdr4,.fdr5{
  border-left:3px solid #ff7d8a
}

.badge{
  font-size:11px;
  padding:3px 6px;
  border-radius:8px;
  background:#26324b
}

.section-title{
  margin:0 0 10px;
  font-size:18px
}

@media(max-width:900px){
  .grid{
    grid-template-columns:repeat(2,1fr)
  }

  .wrap{
    padding:12px
  }
}

@media(max-width:600px){
  .grid{
    grid-template-columns:1fr 1fr
  }

  .big{
    font-size:20px
  }

  th,td{
    font-size:12px;
    padding:7px
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="top">

    <div>
      <div class="logo">⚽ FPL Edge</div>
      <div class="muted" id="sub">
        Loading official FPL snapshot…
      </div>
    </div>

    <button class="btn" id="refresh">
      Refresh live data
    </button>

  </div>


  <div class="tabs">

    <button class="btn active" data-tab="home">
      My Team
    </button>

    <button class="btn" data-tab="players">
      Players
    </button>

    <button class="btn" data-tab="fixtures">
      Fixtures
    </button>

    <button class="btn" data-tab="history">
      History
    </button>

    <button class="btn" data-tab="prices">
      Prices
    </button>

    <button class="btn" data-tab="chips">
      Chips
    </button>

  </div>


  <div id="app" class="loading">
    Loading…
  </div>


  <div class="footer">
    FPL facts come from the official FPL snapshot.
    Flashscore is linked as a separate historical football layer;
    it does not overwrite FPL data.
  </div>

</div>


<script>

const TEAM_ID = 702959;


/*
=====================================================
OFFICIAL FPL CACHE
=====================================================

GitHub repository is fpl--edge
(two hyphens)

The GitHub Action updates this file from the
official FPL API.
*/

const CACHE_URL =
  'https://raw.githubusercontent.com/benwita1998-del/fpl--edge/refs/heads/fpl-cache/data/live.json';


let D = null;


const $ = selector =>
  document.querySelector(selector);


const esc = value =>
  String(value ?? '')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;');


const money = value =>
  `£${Number(value || 0).toFixed(1)}m`;


const num = value =>
  Number(value || 0).toLocaleString();


const pos = type =>
  ({
    1:'GK',
    2:'DEF',
    3:'MID',
    4:'FWD'
  })[type] || '?';


/*
=====================================================
DATA NORMALISATION
=====================================================
*/

function unwrap(value, keys=[]){

  if(value == null){
    return value;
  }

  for(const key of keys){

    if(
      value &&
      typeof value === 'object' &&
      value[key] != null
    ){
      return value[key];
    }

  }

  return value;
}


function historyArray(value){

  return Array.isArray(value)
    ? value
    : value?.current || [];

}


function picksArray(value){

  return Array.isArray(value)
    ? value
    : value?.picks || [];

}


function transfersArray(value){

  return Array.isArray(value)
    ? value
    : value?.transfers ||
      value?.results ||
      [];

}


function chipsArray(value){

  return value?.chips || [];

}


/*
=====================================================
CURRENT GAMEWEEK
=====================================================
*/

function currentEvent(bootstrap){

  const events =
    bootstrap?.events || [];

  return (
    events.find(e => e.is_current) ||
    events.find(e => e.is_next) ||
    events.find(e => !e.finished) ||
    events[0]
  );

}


/*
=====================================================
FREE TRANSFER CALCULATION
=====================================================
*/

function calculateFreeTransfers(history,gw){

  let bank = 0;

  const rows =
    historyArray(history)
      .filter(x => x.event < gw)
      .sort((a,b) => a.event - b.event);


  for(const h of rows){

    const available =
      Math.min(
        5,
        bank + 1
      );

    bank =
      Math.max(
        0,
        available -
        Number(h.event_transfers || 0)
      );

  }


  return Math.min(
    5,
    bank + 1
  );

}


/*
=====================================================
SELLING PRICE
=====================================================
*/

function sellingPrice(currentPrice,paidPrice){

  currentPrice = Number(currentPrice);
  paidPrice = Number(paidPrice);

  if(currentPrice <= paidPrice){
    return paidPrice;
  }

  const profit =
    currentPrice - paidPrice;

  const retained =
    Math.floor(
      (profit / 2) * 10
    ) / 10;

  return Number(
    (paidPrice + retained).toFixed(1)
  );

}


/*
=====================================================
FLASHscore SEARCH
=====================================================
*/

function flashSearch(query){

  return (
    'https://www.flashscore.com/search/?q=' +
    encodeURIComponent(query)
  );

}


/*
=====================================================
NEXT FIVE FIXTURES
=====================================================
*/

function next5(player,bootstrap,gw){

  return (bootstrap.fixtures || [])

    .filter(f =>

      f.event != null &&

      Number(f.event) >= Number(gw) &&

      (
        f.team_h === player.team ||
        f.team_a === player.team
      )

    )

    .sort((a,b) =>

      Number(a.event) -
      Number(b.event) ||

      String(a.kickoff_time || '')
        .localeCompare(
          String(b.kickoff_time || '')
        )

    )

    .slice(0,5)

    .map(f => {

      const home =
        f.team_h === player.team;

      const opponent =
        (bootstrap.teams || [])
          .find(
            t =>
              t.id ===
              (
                home
                  ? f.team_a
                  : f.team_h
              )
          );


      return {

        event:f.event,

        opponent:
          opponent?.short_name ||
          opponent?.name ||
          'TBC',

        opponentName:
          opponent?.name ||
          'TBC',

        home,

        fdr:
          home
            ? f.team_h_difficulty
            : f.team_a_difficulty,

        kickoff:
          f.kickoff_time,

        homeTeam:
          (bootstrap.teams || [])
            .find(t => t.id === f.team_h)
            ?.name || '',

        awayTeam:
          (bootstrap.teams || [])
            .find(t => t.id === f.team_a)
            ?.name || ''

      };

    });

}


/*
=====================================================
FIXTURE HTML
=====================================================
*/

function fixtureHtml(
  fixture,
  teamName,
  playerName
){

  const h2hQuery =
    teamName +
    ' ' +
    fixture.opponentName +
    ' Premier League';


  const playerQuery =
    playerName +
    ' ' +
    fixture.opponentName +
    ' Premier League';


  const cls =
    'fdr' +
    (fixture.fdr || 3);


  return `

    <span class="fixture ${cls}">

      <b>
        GW${fixture.event}
      </b>

      ${fixture.home ? 'H' : 'A'}

      ${esc(fixture.opponent)}

      · FDR ${fixture.fdr ?? '—'}

      <a
        class="link"
        target="_blank"
        rel="noopener"
        href="${flashSearch(h2hQuery)}"
      >
        H2H
      </a>

      <a
        class="link"
        target="_blank"
        rel="noopener"
        href="${flashSearch(playerQuery)}"
      >
        Player
      </a>

    </span>

  `;

}


/*
=====================================================
LOAD OFFICIAL FPL SNAPSHOT
=====================================================
*/

async function load(){

  $('#sub').textContent =
    'Loading the latest official FPL snapshot…';


  $('#app').innerHTML =
    '<div class="loading">Loading official FPL data…</div>';


  const response =
    await fetch(
      CACHE_URL +
      '?v=' +
      Date.now(),
      {
        cache:'no-store'
      }
    );


  if(!response.ok){

    throw new Error(
      `FPL cache returned HTTP ${response.status}`
    );

  }


  const raw =
    await response.json();


  /*
  -----------------------------------------------
  NORMALISE SNAPSHOT
  -----------------------------------------------
  */

  const bootstrap =
    unwrap(
      raw,
      [
        'bootstrap',
        'bootstrap_static',
        'b',
        'data'
      ]
    ) || {};


  const entry =
    unwrap(
      raw,
      [
        'entry',
        'team'
      ]
    ) || {};


  const history =
    unwrap(
      raw,
      ['history']
    ) || {};


  const transfers =
    unwrap(
      raw,
      ['transfers']
    ) || [];


  const picks =
    unwrap(
      raw,
      ['picks']
    ) || [];


  if(
    !bootstrap?.elements ||
    !bootstrap.elements.length
  ){

    throw new Error(
      'The cache loaded, but no official FPL player database was found.'
    );

  }


  const gw =
    currentEvent(bootstrap);


  if(!gw){

    throw new Error(
      'No current or next Gameweek was found in the official FPL snapshot.'
    );

  }


  /*
  -----------------------------------------------
  TEAM LOOKUP
  -----------------------------------------------
  */

  const teamMap =
    Object.fromEntries(
      (bootstrap.teams || [])
        .map(team => [
          team.id,
          team
        ])
    );


  /*
  -----------------------------------------------
  PLAYER LOOKUP
  -----------------------------------------------
  */

  const playerMap =
    Object.fromEntries(
      (bootstrap.elements || [])
        .map(player => [
          player.id,
          player
        ])
    );


  /*
  -----------------------------------------------
  CURRENT PICKS
  -----------------------------------------------
  */

  const currentPicks =
    picksArray(picks);


  const squad =
    currentPicks

      .map(pick => {

        const player =
          playerMap[pick.element];


        if(!player){
          return null;
        }


        const team =
          teamMap[player.team];


        const paid =
          pick.purchase_price != null
            ? Number(pick.purchase_price) / 10
            : null;


        const current =
          Number(player.now_cost || 0) / 10;


        const sell =
          pick.selling_price != null
            ? Number(pick.selling_price) / 10
            : (
                paid != null
                  ? sellingPrice(
                      current,
                      paid
                    )
                  : current
              );


        return {

          ...pick,

          player,

          team,

          next5:
            next5(
              player,
              bootstrap,
              gw.id
            ),

          purchasePrice:paid,

          sellingPrice:sell

        };

      })

      .filter(Boolean);


  /*
  -----------------------------------------------
  ALL PLAYERS
  -----------------------------------------------
  */

  const allPlayers =
    (bootstrap.elements || [])
      .map(player => {

        const team =
          teamMap[player.team];


        return {

          ...player,

          name:
            player.web_name,

          teamName:
            team?.name || '',

          teamShort:
            team?.short_name || '',

          position:
            pos(player.element_type),

          price:
            Number(player.now_cost || 0) / 10,

          next5:
            next5(
              player,
              bootstrap,
              gw.id
            )

        };

      });


  /*
  -----------------------------------------------
  FINAL DATA OBJECT
  -----------------------------------------------
  */

  D = {

    bootstrap,

    entry,

    history,

    transfers,

    picks,

    gw,

    teamMap,

    playerMap,

    squad,

    allPlayers,

    freeTransfers:
      calculateFreeTransfers(
        history,
        gw.id
      )

  };


  $('#sub').textContent =
    `${entry.name || 'Team ' + TEAM_ID} · GW${gw.id} · Official FPL data`;


  render('home');

}


/*
=====================================================
STATISTICS
=====================================================
*/

function stats(){

  const historyRows =
    historyArray(D.history);


  const currentGW =
    historyRows.find(
      x =>
        Number(x.event) ===
        Number(D.gw.id)
    );


  const chips =
    chipsArray(D.history);


  const value =
    (
      D.entry.last_deadline_value ??
      D.entry.value ??
      0
    ) / 10;


  const bank =
    (
      D.entry.last_deadline_bank ??
      D.entry.bank ??
      0
    ) / 10;


  return `

    <div class="grid">

      <div class="card">

        <div class="label">
          Gameweek
        </div>

        <div class="big">
          GW${D.gw.id}
        </div>

      </div>


      <div class="card">

        <div class="label">
          Overall rank
        </div>

        <div class="big">
          ${num(D.entry.summary_overall_rank)}
        </div>

      </div>


      <div class="card">

        <div class="label">
          Total points
        </div>

        <div class="big">
          ${num(D.entry.summary_overall_points)}
        </div>

      </div>


      <div class="card">

        <div class="label">
          GW points
        </div>

        <div class="big">
          ${
            currentGW?.points ??
            D.entry.summary_event_points ??
            '—'
          }
        </div>

      </div>


      <div class="card">

        <div class="label">
          Team value
        </div>

        <div class="big">
          ${money(value)}
        </div>

      </div>


      <div class="card">

        <div class="label">
          Bank
        </div>

        <div class="big">
          ${money(bank)}
        </div>

      </div>


      <div class="card">

        <div class="label">
          Free transfers
        </div>

        <div class="big">
          ${D.freeTransfers}
        </div>

      </div>


      <div class="card">

        <div class="label">
          Chips used
        </div>

        <div class="big">
          ${chips.length}
        </div>

      </div>

    </div>

  `;

}


/*
=====================================================
MY TEAM
=====================================================
*/

function myTeam(){

  const starters =
    D.squad
      .filter(x =>
        Number(x.position) <= 11
      )
      .sort(
        (a,b) =>
          Number(a.position) -
          Number(b.position)
      );


  const bench =
    D.squad
      .filter(x =>
        Number(x.position) > 11
      )
      .sort(
        (a,b) =>
          Number(a.position) -
          Number(b.position)
      );


  const renderRows =
    players =>

      players
        .map(x => {

          const player =
            x.player;

          const team =
            x.team;


          const status =
            player.status === 'a'

              ? `<span class="good">
                   Available
                 </span>`

              : `<span class="warn">
                   ${esc(
                     player.news ||
                     player.status ||
                     'Unknown'
                   )}
                 </span>`;


          return `

            <tr>

              <td>

                <b>
                  ${esc(player.web_name)}
                </b>

                <br>

                <span class="muted">

                  ${pos(player.element_type)}

                  ${
                    x.is_captain
                      ? ' · C'
                      : ''
                  }

                  ${
                    x.is_vice_captain
                      ? ' · VC'
                      : ''
                  }

                </span>

              </td>


              <td>
                ${esc(
                  team?.short_name || ''
                )}
              </td>


              <td>
                ${money(
                  Number(player.now_cost || 0) / 10
                )}
              </td>


              <td>
                ${
                  x.purchasePrice == null
                    ? '—'
                    : money(x.purchasePrice)
                }
              </td>


              <td>
                ${money(x.sellingPrice)}
              </td>


              <td>
                ${num(player.total_points)}
              </td>


              <td>
                ${player.form ?? '—'}
              </td>


              <td>
                ${player.points_per_game ?? '—'}
              </td>


              <td>
                ${player.minutes ?? 0}
              </td>


              <td>
                ${player.goals_scored ?? 0}
              </td>


              <td>
                ${player.assists ?? 0}
              </td>


              <td>
                ${player.clean_sheets ?? 0}
              </td>


              <td>
                ${player.bonus ?? 0}
              </td>


              <td>
                ${player.bps ?? 0}
              </td>


              <td>
                ${player.selected_by_percent ?? '—'}%
              </td>


              <td>
                ${status}
              </td>


              <td>

                ${
                  x.next5.length

                    ? x.next5
                        .map(f =>
                          fixtureHtml(
                            f,
                            team?.name || '',
                            player.web_name
                          )
                        )
                        .join('')

                    : '<span class="muted">No upcoming fixture</span>'
                }

              </td>

            </tr>

          `;

        })

        .join('');


  return `

    ${stats()}


    <div
      class="card wide"
      style="margin-top:12px"
    >

      <h2 class="section-title">
        Starting XI
      </h2>


      <div class="scroll">

        <table>

          <thead>

            <tr>

              <th>Player</th>
              <th>Club</th>
              <th>Price</th>
              <th>Paid</th>
              <th>Sell</th>
              <th>Pts</th>
              <th>Form</th>
              <th>PPG</th>
              <th>Min</th>
              <th>G</th>
              <th>A</th>
              <th>CS</th>
              <th>Bonus</th>
              <th>BPS</th>
              <th>Own%</th>
              <th>Status</th>
              <th>Next 5 + Flashscore</th>

            </tr>

          </thead>


          <tbody>

            ${
              renderRows(starters) ||

              `
                <tr>
                  <td colspan="17">
                    Current picks are not available
                    in this snapshot.
                  </td>
                </tr>
              `
            }

          </tbody>

        </table>

      </div>

    </div>


    <div
      class="card wide"
      style="margin-top:12px"
    >

      <h2 class="section-title">
        Bench
      </h2>


      <div class="scroll">

        <table>

          <thead>

            <tr>

              <th>Player</th>
              <th>Club</th>
              <th>Price</th>
              <th>Paid</th>
              <th>Sell</th>
              <th>Pts</th>
              <th>Form</th>
              <th>PPG</th>
              <th>Min</th>
              <th>G</th>
              <th>A</th>
              <th>CS</th>
              <th>Bonus</th>
              <th>BPS</th>
              <th>Own%</th>
              <th>Status</th>
              <th>Next 5 + Flashscore</th>

            </tr>

          </thead>


          <tbody>

            ${
              renderRows(bench) ||

              `
                <tr>
                  <td colspan="17">
                    No bench data found.
                  </td>
                </tr>
              `
            }

          </tbody>

        </table>

      </div>

    </div>

  `;

}


/*
=====================================================
PLAYERS
=====================================================
*/

function players(){

  const rows =
    D.allPlayers

      .slice()

      .sort(
        (a,b) =>
          (b.total_points || 0) -
          (a.total_points || 0)
      )

      .slice(0,150)

      .map(player => `

        <tr>

          <td>
            <b>
              ${esc(player.name)}
            </b>
          </td>

          <td>
            ${esc(player.teamShort)}
          </td>

          <td>
            ${player.position}
          </td>

          <td>
            ${money(player.price)}
          </td>

          <td>
            ${player.total_points ?? 0}
          </td>

          <td>
            ${player.form ?? '—'}
          </td>

          <td>
            ${player.points_per_game ?? '—'}
          </td>

          <td>
            ${player.minutes ?? 0}
          </td>

          <td>
            ${player.goals_scored ?? 0}
          </td>

          <td>
            ${player.assists ?? 0}
          </td>

          <td>
            ${player.expected_goals ?? '—'}
          </td>

          <td>
            ${player.expected_assists ?? '—'}
          </td>

          <td>
            ${player.selected_by_percent ?? '—'}%
          </td>

          <td>
            ${
              player.status === 'a'
                ? '<span class="good">Available</span>'
                : '<span class="warn">' +
                  esc(
                    player.news ||
                    player.status ||
                    ''
                  ) +
                  '</span>'
            }
          </td>

          <td>

            ${
              player.next5.length

                ? player.next5
                    .map(f =>
                      fixtureHtml(
                        f,
                        player.teamName,
                        player.name
                      )
                    )
                    .join('')

                : '<span class="muted">No upcoming fixture</span>'
            }

          </td>

        </tr>

      `)

      .join('');


  return `

    <div class="card">

      <div class="label">
        Official FPL player database
      </div>


      <p class="muted">

        Positions, prices, points, form,
        minutes, ownership, xG/xA,
        status and fixtures come from
        the official FPL snapshot.

      </p>


      <div class="scroll">

        <table>

          <thead>

            <tr>

              <th>Player</th>
              <th>Club</th>
              <th>Pos</th>
              <th>Price</th>
              <th>Pts</th>
              <th>Form</th>
              <th>PPG</th>
              <th>Min</th>
              <th>G</th>
              <th>A</th>
              <th>xG</th>
              <th>xA</th>
              <th>Own%</th>
              <th>Status</th>
              <th>Next 5 + Flashscore</th>

            </tr>

          </thead>


          <tbody>
            ${rows}
          </tbody>

        </table>

      </div>

    </div>

  `;

}


/*
=====================================================
FIXTURES
=====================================================
*/

function fixtures(){

  const upcoming =
    (D.bootstrap.fixtures || [])

      .filter(f =>
        f.event != null &&
        Number(f.event) >= Number(D.gw.id)
      )

      .sort(
        (a,b) =>
          Number(a.event) -
          Number(b.event) ||

          String(a.kickoff_time || '')
            .localeCompare(
              String(b.kickoff_time || '')
            )
      )

      .slice(0,60);


  return `

    <div class="card">

      <div class="label">
        Official FPL fixture list +
        Flashscore history
      </div>


      <p class="muted">

        Each fixture is linked to
        Flashscore for team H2H and
        match-history information.

      </p>


      <div class="scroll">

        <table>

          <thead>

            <tr>

              <th>GW</th>
              <th>Fixture</th>
              <th>FDR H</th>
              <th>FDR A</th>
              <th>Flashscore</th>

            </tr>

          </thead>


          <tbody>

            ${
              upcoming

                .map(f => {

                  const home =
                    D.teamMap[f.team_h];

                  const away =
                    D.teamMap[f.team_a];


                  const query =
                    (
                      home?.name || ''
                    ) +
                    ' ' +
                    (
                      away?.name || ''
                    ) +
                    ' Premier League';


                  return `

                    <tr>

                      <td>
                        GW${f.event}
                      </td>


                      <td>

                        <b>
                          ${esc(
                            home?.name ||
                            'TBC'
                          )}
                        </b>

                        vs

                        <b>
                          ${esc(
                            away?.name ||
                            'TBC'
                          )}
                        </b>

                      </td>


                      <td>
                        ${f.team_h_difficulty ?? '—'}
                      </td>


                      <td>
                        ${f.team_a_difficulty ?? '—'}
                      </td>


                      <td>

                        <a
                          class="link"
                          target="_blank"
                          rel="noopener"
                          href="${flashSearch(query)}"
                        >
                          Open H2H / match history ↗
                        </a>

                      </td>

                    </tr>

                  `;

                })

                .join('')

            }

          </tbody>

        </table>

      </div>

    </div>

  `;

}


/*
=====================================================
HISTORY
=====================================================
*/

function history(){

  const rows =
    historyArray(D.history);


  return `

    <div class="card">

      <div class="label">
        Season history
      </div>


      <div class="scroll">

        <table>

          <thead>

            <tr>

              <th>GW</th>
              <th>Pts</th>
              <th>Total</th>
              <th>Rank</th>
              <th>Transfers</th>
              <th>Hit</th>
              <th>Value</th>
              <th>Bank</th>

            </tr>

          </thead>


          <tbody>

            ${
              rows

                .map(h => `

                  <tr>

                    <td>
                      GW${h.event}
                    </td>

                    <td>
                      ${h.points}
                    </td>

                    <td>
                      ${h.total_points}
                    </td>

                    <td>
                      ${num(h.overall_rank)}
                    </td>

                    <td>
                      ${h.event_transfers ?? 0}
                    </td>

                    <td>
                      ${h.event_transfers_cost ?? 0}
                    </td>

                    <td>
                      ${money(
                        Number(h.value || 0) / 10
                      )}
                    </td>

                    <td>
                      ${money(
                        Number(h.bank || 0) / 10
                      )}
                    </td>

                  </tr>

                `)

                .join('')

            }

          </tbody>

        </table>

      </div>

    </div>

  `;

}


/*
=====================================================
PRICES
=====================================================
*/

function prices(){

  const rows =
    D.allPlayers

      .slice()

      .sort(
        (a,b) =>
          Math.abs(
            b.cost_change_event || 0
          ) -
          Math.abs(
            a.cost_change_event || 0
          )
      )

      .slice(0,100)

      .map(player => `

        <tr>

          <td>
            ${esc(player.name)}
          </td>

          <td>
            ${esc(player.teamShort)}
          </td>

          <td>
            ${money(player.price)}
          </td>

          <td>

            ${
              player.cost_change_event > 0
                ? '+'
                : ''
            }

            ${
              player.cost_change_event
                ? (
                    Number(
                      player.cost_change_event
                    ) / 10
                  ).toFixed(1) + 'm'
                : '—'
            }

          </td>

          <td>

            ${
              player.cost_change_start > 0
                ? '+'
                : ''
            }

            ${
              player.cost_change_start
                ? (
                    Number(
                      player.cost_change_start
                    ) / 10
                  ).toFixed(1) + 'm'
                : '—'
            }

          </td>

          <td>
            ${player.selected_by_percent ?? '—'}%
          </td>

        </tr>

      `)

      .join('');


  return `

    <div class="card">

      <div class="label">
        Official FPL price data
      </div>


      <p class="muted">

        Confirmed price movements are
        shown from the official FPL
        player dataset.

      </p>


      <div class="scroll">

        <table>

          <thead>

            <tr>

              <th>Player</th>
              <th>Club</th>
              <th>Price</th>
              <th>GW Move</th>
              <th>Season Move</th>
              <th>Ownership</th>

            </tr>

          </thead>


          <tbody>

            ${rows}

          </tbody>

        </table>

      </div>

    </div>

  `;

}


/*
=====================================================
CHIPS
=====================================================
*/

function chips(){

  const used =
    chipsArray(D.history);


  const names = [

    ['wildcard','Wildcard'],

    ['freehit','Free Hit'],

    ['bboost','Bench Boost'],

    ['3xc','Triple Captain']

  ];


  const cards =
    names

      .flatMap(
        ([key,name]) =>

          [1,2].map(half => {

            const usedChip =
              used.find(
                chip =>
                  chip.name === key &&
                  (
                    half === 1
                      ? chip.event <= 19
                      : chip.event >= 20
                  )
              );


            return `

              <div class="card">

                <div class="label">

                  ${name}
                  · Half ${half}

                </div>


                <div class="big">

                  ${
                    usedChip
                      ? 'Used GW' +
                        usedChip.event
                      : 'AVAILABLE'
                  }

                </div>

              </div>

            `;

          })

      )

      .join('');


  return `

    <div class="grid">

      ${cards}

    </div>


    <div
      class="card"
      style="margin-top:12px"
    >

      <b>
        2026/27 FPL chip rules
      </b>


      <p class="muted">

        Two sets of Wildcard,
        Free Hit, Bench Boost and
        Triple Captain.

        The first set expires after
        GW19 and the second set is
        available from GW20.

        Only one chip can be used
        in a Gameweek.

      </p>

    </div>

  `;

}


/*
=====================================================
RENDER
=====================================================
*/

function render(tab){

  document
    .querySelectorAll('[data-tab]')
    .forEach(button => {

      button.classList.toggle(
        'active',
        button.dataset.tab === tab
      );

    });


  if(tab === 'home'){

    $('#app').innerHTML =
      myTeam();

  }

  else if(tab === 'players'){

    $('#app').innerHTML =
      players();

  }

  else if(tab === 'fixtures'){

    $('#app').innerHTML =
      fixtures();

  }

  else if(tab === 'history'){

    $('#app').innerHTML =
      history();

  }

  else if(tab === 'prices'){

    $('#app').innerHTML =
      prices();

  }

  else if(tab === 'chips'){

    $('#app').innerHTML =
      chips();

  }

}


/*
=====================================================
TAB BUTTONS
=====================================================
*/

document
  .querySelectorAll('[data-tab]')
  .forEach(button => {

    button.onclick = () => {

      render(
        button.dataset.tab
      );

    };

  });


/*
=====================================================
REFRESH BUTTON
=====================================================
*/

$('#refresh').onclick = () => {

  load()

    .catch(error => {

      console.error(
        'FPL Edge data error:',
        error
      );


      $('#sub').textContent =
        'Data load error';


      $('#app').innerHTML = `

        <div class="card error">

          <b>
            Unable to load FPL data.
          </b>

          <p>
            ${esc(error.message)}
          </p>

          <p class="muted">

            The cache is the
            official-data bridge
            for the Vercel app.

          </p>

        </div>

      `;

    });

};


/*
=====================================================
INITIAL LOAD
=====================================================
*/

load()

  .catch(error => {

    console.error(
      'FPL Edge initial load error:',
      error
    );


    $('#sub').textContent =
      'Data load error';


    $('#app').innerHTML = `

      <div class="card error">

        <b>
          Unable to load FPL data.
        </b>

        <p>
          ${esc(error.message)}
        </p>

        <p class="muted">

          Check that the GitHub Actions
          cache has produced
          data/live.json.

        </p>

      </div>

    `;

  });


/*
=====================================================
SERVICE WORKER
=====================================================
*/

if('serviceWorker' in navigator){

  navigator.serviceWorker
    .register(
      '/sw.js?v=8'
    )
    .catch(
      () => {}
    );

}

</script>

</body>

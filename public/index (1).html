<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<title>FPL Edge</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1020;color:#f4f6fb}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:1400px;margin:auto;padding:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-size:27px;font-weight:900}.muted{color:#9da7bc}.tabs{display:flex;gap:8px;overflow:auto;margin:18px 0}
.btn{border:1px solid #303a52;background:#151d31;color:#fff;border-radius:10px;padding:9px 12px;cursor:pointer}
.btn.active{background:#fff;color:#101522}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.card{background:#121a2b;border:1px solid #27324a;border-radius:14px;padding:15px}.wide{grid-column:1/-1}
.label{font-size:12px;color:#8e9ab2;text-transform:uppercase;letter-spacing:.08em}.big{font-size:24px;font-weight:800;margin-top:5px}
.scroll{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #27324a;white-space:nowrap;font-size:13px}
.pill{padding:3px 7px;border-radius:999px;background:#24304a}.good{color:#7ee2a8}.bad{color:#ff8d9d}.warn{color:#ffd36e}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #27324a}
.hero{font-size:21px;font-weight:800}.footer{margin:20px 0;color:#75809a;font-size:12px}
.error{border:1px solid #6b3440;background:#24141a}.ok{border:1px solid #285d46;background:#12251d}
.loading{padding:30px;text-align:center}.small{font-size:12px}.link{color:#9bc4ff;text-decoration:none}.link:hover{text-decoration:underline}
.fixture{display:inline-flex;align-items:center;gap:5px;margin:2px 4px 2px 0;padding:5px 7px;background:#202a41;border-radius:8px}
.fdr1,.fdr2{border-left:3px solid #4fd18b}.fdr3{border-left:3px solid #9da7bc}.fdr4,.fdr5{border-left:3px solid #ff7d8a}
.badge{font-size:11px;padding:3px 6px;border-radius:8px;background:#26324b}.section-title{margin:0 0 10px;font-size:18px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:12px}}
@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}.big{font-size:20px}th,td{font-size:12px;padding:7px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="logo">⚽ FPL Edge</div>
      <div class="muted" id="sub">Loading official FPL snapshot…</div>
    </div>
    <button class="btn" id="refresh">Refresh live data</button>
  </div>

  <div class="tabs">
    <button class="btn active" data-tab="home">My Team</button>
    <button class="btn" data-tab="players">Players</button>
    <button class="btn" data-tab="fixtures">Fixtures</button>
    <button class="btn" data-tab="history">History</button>
    <button class="btn" data-tab="prices">Prices</button>
    <button class="btn" data-tab="chips">Chips</button>
  </div>

  <div id="app" class="loading">Loading…</div>
  <div class="footer">
    FPL facts come from the official FPL snapshot. Flashscore is linked as a separate historical football layer; it does not overwrite FPL data.
  </div>
</div>

<script>
const TEAM_ID=702959;
const CACHE_URL='https://raw.githubusercontent.com/benwita1998-del/fpl--edge/refs/heads/fpl-cache/data/live.json';
let D=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const money=x=>`£${Number(x||0).toFixed(1)}m`;
const num=x=>Number(x||0).toLocaleString();
const pos=t=>({1:'GK',2:'DEF',3:'MID',4:'FWD'})[t]||'?';

function unwrap(v,keys=[]){
  if(v==null)return v;
  for(const k of keys) if(v && typeof v==='object' && v[k]!=null) return v[k];
  return v;
}
function currentEvent(b){
  const ev=b?.events||[];
  return ev.find(e=>e.is_current)||ev.find(e=>e.is_next)||ev.find(e=>!e.finished)||ev[0];
}
function historyArray(h){return Array.isArray(h)?h:(h?.current||[])}
function picksArray(p){return Array.isArray(p)?p:(p?.picks||[])}
function transfersArray(t){return Array.isArray(t)?t:(t?.transfers||t?.results||[])}
function chipsArray(h){return h?.chips||[]}

function normaliseSnapshot(s){
  const b=unwrap(s,['bootstrap','bootstrap_static','b','data'])||{};
  const entry=unwrap(s,['entry','team'])||{};
  const history=unwrap(s,['history'])||{};
  const transfers=unwrap(s,['transfers'])||[];
  const picks=unwrap(s,['picks'])||[];
  return {b,entry,history,transfers,picks};
}
function flashSearch(q){
  return 'https://www.flashscore.com/search/?q='+encodeURIComponent(q);
}
function next5(p,b,gw){
  return (b.fixtures||[])
    .filter(f=>f.event!=null && f.event>=gw && (f.team_h===p.team||f.team_a===p.team))
    .sort((a,b)=>a.event-b.event || String(a.kickoff_time||'').localeCompare(String(b.kickoff_time||'')))
    .slice(0,5)
    .map(f=>{
      const home=f.team_h===p.team;
      const opp=(b.teams||[]).find(t=>t.id===(home?f.team_a:f.team_h));
      return {event:f.event,opponent:opp?.short_name||opp?.name||'TBC',opponentName:opp?.name||'TBC',home,fdr:home?f.team_h_difficulty:f.team_a_difficulty,kickoff:f.kickoff_time,homeTeam:b.teams?.find(t=>t.id===f.team_h)?.name||'',awayTeam:b.teams?.find(t=>t.id===f.team_a)?.name||''};
    });
}
function ft(history,gw){
  let bank=0;
  for(const h of historyArray(history).filter(x=>x.event<gw).sort((a,b)=>a.event-b.event)){
    const available=Math.min(5,bank+1);
    bank=Math.max(0,available-(h.event_transfers||0));
  }
  return Math.min(5,bank+1);
}
function sell(now,paid){
  now=+now;paid=+paid;
  if(now<=paid)return paid;
  return +(paid+Math.floor(((now-paid)/2)*10+1e-9)/10).toFixed(1);
}
function fixtureHtml(f,teamName,playerName){
  const q=teamName+' '+f.opponentName+' Premier League';
  const p=playerName+' '+f.opponentName+' Premier League';
  const cls='fdr'+(f.fdr||3);
  return `<span class="fixture ${cls}"><b>GW${f.event}</b> ${f.home?'H':'A'} ${esc(f.opponent)} · FDR ${f.fdr??'—'}
    <a class="link" target="_blank" rel="noopener" href="${flashSearch(q)}">H2H</a>
    <a class="link" target="_blank" rel="noopener" href="${flashSearch(p)}">Player</a></span>`;
}

async function load(){
  $('#sub').textContent='Loading the latest official FPL snapshot…';
  const r=await fetch(CACHE_URL+'?v='+Date.now(),{cache:'no-store'});
  if(!r.ok) throw new Error(`FPL cache returned HTTP ${r.status}`);
  const raw=await r.json();
  const s=normaliseSnapshot(raw);
  if(!s.b?.elements?.length) throw new Error('The cache loaded, but no official FPL player database was found.');
  const gw=currentEvent(s.b);
  if(!gw) throw new Error('No current/next Gameweek was found in the official FPL snapshot.');

  const teamMap=Object.fromEntries((s.b.teams||[]).map(t=>[t.id,t]));
  const playerMap=Object.fromEntries((s.b.elements||[]).map(p=>[p.id,p]));
  const picks=picksArray(s.picks);
  const squad=picks.map(x=>{
    const p=playerMap[x.element];
    if(!p)return null;
    const team=teamMap[p.team];
    return {...x,player:p,team,next5:next5(p,s.b,gw.id),
      purchasePrice:x.purchase_price!=null?x.purchase_price/10:null,
      sellingPrice:x.selling_price!=null?x.selling_price/10:sell(p.now_cost/10,p.now_cost/10)};
  }).filter(Boolean);

  const allPlayers=(s.b.elements||[]).map(p=>({
    ...p,name:p.web_name,teamName:teamMap[p.team]?.name||'',teamShort:teamMap[p.team]?.short_name||'',
    position:pos(p.element_type),price:p.now_cost/10,next5:next5(p,s.b,gw.id)
  }));

  D={...s,gw,teamMap,playerMap,squad,allPlayers,freeTransfers:ft(s.history,gw.id)};
  $('#sub').textContent=`${s.entry?.name||'Team '+TEAM_ID} · GW${gw.id} · Official FPL data`;
  render('home');
}

function stats(){
  const h=historyArray(D.history);
  const cur=h.find(x=>x.event===D.gw.id);
  const chips=chipsArray(D.history);
  const value=(D.entry.last_deadline_value??D.entry.value??0)/10;
  const bank=(D.entry.last_deadline_bank??D.entry.bank??0)/10;
  return `<div class="grid">
    ${[
      ['Gameweek','GW'+D.gw.id],
      ['Overall rank',num(D.entry.summary_overall_rank)],
      ['Total points',num(D.entry.summary_overall_points)],
      ['GW points',cur?.points??D.entry.summary_event_points??'—'],
      ['Team value',money(value)],
      ['Bank',money(bank)],
      ['Free transfers',D.freeTransfers],
      ['Chips used',chips.length]
    ].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="big">${x[1]}</div></div>`).join('')}
  </div>`;
}

function myTeam(){
  const starters=D.squad.filter(x=>x.position<=11).sort((a,b)=>a.position-b.position);
  const bench=D.squad.filter(x=>x.position>11).sort((a,b)=>a.position-b.position);
  const renderRows=arr=>arr.map(x=>{
    const p=x.player, team=x.team;
    return `<tr>
      <td><b>${esc(p.web_name)}</b><br><span class="muted">${pos(p.element_type)} ${x.is_captain?'· C':''}${x.is_vice_captain?' · VC':''}</span></td>
      <td>${esc(team?.short_name||'')}</td>
      <td>${money(p.now_cost/10)}</td>
      <td>${x.purchasePrice==null?'—':money(x.purchasePrice)}</td>
      <td>${money(x.sellingPrice)}</td>
      <td>${num(p.total_points)}</td>
      <td>${p.form??'—'}</td>
      <td>${p.points_per_game??'—'}</td>
      <td>${p.minutes??0}</td>
      <td>${p.goals_scored??0}</td>
      <td>${p.assists??0}</td>
      <td>${p.clean_sheets??0}</td>
      <td>${p.bonus??0}</td>
      <td>${p.bps??0}</td>
      <td>${p.selected_by_percent??'—'}%</td>
      <td>${p.status==='a'?'<span class="good">Available</span>':'<span class="warn">'+esc(p.news||p.status)+'</span>'}</td>
      <td>${x.next5.map(f=>fixtureHtml(f,team?.name||'',p.web_name)).join('')}</td>
    </tr>`;
  }).join('');
  return stats()+`
  <div class="card wide" style="margin-top:12px">
    <h2 class="section-title">Starting XI</h2>
    <div class="scroll"><table><thead><tr>
      <th>Player</th><th>Club</th><th>Price</th><th>Paid</th><th>Sell</th><th>Pts</th><th>Form</th><th>PPG</th><th>Min</th><th>G</th><th>A</th><th>CS</th><th>Bonus</th><th>BPS</th><th>Own%</th><th>Status</th><th>Next 5 + Flashscore</th>
    </tr></thead><tbody>${renderRows(starters)||'<tr><td colspan="17">Current picks are not available in this snapshot.</td></tr>'}</tbody></table></div>
  </div>
  <div class="card wide" style="margin-top:12px">
    <h2 class="section-title">Bench</h2>
    <div class="scroll"><table><thead><tr>
      <th>Player</th><th>Club</th><th>Price</th><th>Paid</th><th>Sell</th><th>Pts</th><th>Form</th><th>PPG</th><th>Min</th><th>G</th><th>A</th><th>CS</th><th>Bonus</th><th>BPS</th><th>Own%</th><th>Status</th><th>Next 5 + Flashscore</th>
    </tr></thead><tbody>${renderRows(bench)||'<tr><td colspan="17">No bench data found.</td></tr>'}</tbody></table></div>
  </div>`;
}

function players(){
  const rows=D.allPlayers.slice().sort((a,b)=>(b.total_points||0)-(a.total_points||0)).slice(0,150).map(p=>`<tr>
    <td><b>${esc(p.name)}</b></td><td>${esc(p.teamShort)}</td><td>${p.position}</td><td>${money(p.price)}</td>
    <td>${p.total_points??0}</td><td>${p.form??'—'}</td><td>${p.points_per_game??'—'}</td><td>${p.minutes??0}</td>
    <td>${p.goals_scored??0}</td><td>${p.assists??0}</td><td>${p.expected_goals??'—'}</td><td>${p.expected_assists??'—'}</td>
    <td>${p.selected_by_percent??'—'}%</td><td>${p.status}</td>
    <td>${p.next5.map(f=>fixtureHtml(f,p.teamName,p.name)).join('')}</td>
  </tr>`).join('');
  return `<div class="card"><div class="label">Official FPL player database</div><p class="muted">Positions, prices, points, form, minutes, ownership, xG/xA, status and fixtures come from the official FPL snapshot.</p>
  <div class="scroll"><table><thead><tr><th>Player</th><th>Club</th><th>Pos</th><th>Price</th><th>Pts</th><th>Form</th><th>PPG</th><th>Min</th><th>G</th><th>A</th><th>xG</th><th>xA</th><th>Own%</th><th>Status</th><th>Next 5 + Flashscore</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

function fixtures(){
  const upcoming=(D.b.fixtures||[]).filter(f=>f.event!=null && f.event>=D.gw.id).sort((a,b)=>a.event-b.event || String(a.kickoff_time||'').localeCompare(String(b.kickoff_time||''))).slice(0,60);
  return `<div class="card"><div class="label">Official FPL fixture list + Flashscore history</div>
  <p class="muted">Each fixture is linked to a Flashscore search for team H2H and a player-vs-opponent search where a player is shown.</p>
  <div class="scroll"><table><thead><tr><th>GW</th><th>Fixture</th><th>FDR H</th><th>FDR A</th><th>Flashscore</th></tr></thead><tbody>
  ${upcoming.map(f=>{
    const h=D.teamMap[f.team_h],a=D.teamMap[f.team_a],q=(h?.name||'')+' '+(a?.name||'')+' Premier League';
    return `<tr><td>GW${f.event}</td><td><b>${esc(h?.name||'TBC')}</b> vs <b>${esc(a?.name||'TBC')}</b></td><td>${f.team_h_difficulty??'—'}</td><td>${f.team_a_difficulty??'—'}</td><td><a class="link" target="_blank" rel="noopener" href="${flashSearch(q)}">Open H2H / match history ↗</a></td></tr>`;
  }).join('')}</tbody></table></div></div>`;
}

function history(){
  const hs=historyArray(D.history);
  return `<div class="card"><div class="label">Season history</div><div class="scroll"><table><thead><tr><th>GW</th><th>Pts</th><th>Total</th><th>Rank</th><th>Transfers</th><th>Hit</th><th>Value</th><th>Bank</th></tr></thead><tbody>
  ${hs.map(h=>`<tr><td>GW${h.event}</td><td>${h.points}</td><td>${h.total_points}</td><td>${num(h.overall_rank)}</td><td>${h.event_transfers??0}</td><td>${h.event_transfers_cost??0}</td><td>${money((h.value||0)/10)}</td><td>${money((h.bank||0)/10)}</td></tr>`).join('')}</tbody></table></div></div>`;
}
function prices(){
  const rows=D.allPlayers.slice().sort((a,b)=>Math.abs(b.cost_change_event||0)-Math.abs(a.cost_change_event||0)).slice(0,100).map(p=>`<tr>
    <td>${esc(p.name)}</td><td>${esc(p.teamShort)}</td><td>${money(p.price)}</td><td>${p.cost_change_event>0?'+':''}${p.cost_change_event?((p.cost_change_event/10).toFixed(1)+'m'):'—'}</td><td>${p.cost_change_start>0?'+':''}${p.cost_change_start?((p.cost_change_start/10).toFixed(1)+'m'):'—'}</td><td>${p.selected_by_percent??'—'}%</td>
  </tr>`).join('');
  return `<div class="card"><div class="label">Official FPL price data</div><p class="muted">Confirmed price movements shown from the official player dataset.</p><div class="scroll"><table><thead><tr><th>Player</th><th>Club</th><th>Price</th><th>GW move</th><th>Season move</th><th>Ownership</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
function chips(){
  const used=chipsArray(D.history), names=[['wildcard','Wildcard'],['freehit','Free Hit'],['bboost','Bench Boost'],['3xc','Triple Captain']];
  return `<div class="grid">${names.flatMap(([k,n])=>[1,2].map(h=>{
    const u=used.find(c=>c.name===k&&(h===1?c.event<=19:c.event>=20));
    return `<div class="card"><div class="label">${n} · half ${h}</div><div class="big">${u?'Used GW'+u.event:'AVAILABLE'}</div></div>`;
  })).join('')}</div><div class="card" style="margin-top:12px"><b>2026/27 rules</b><p class="muted">Two sets of Wildcard, Free Hit, Bench Boost and Triple Captain; first set before GW19 and second from GW20. Up to five free transfers can be rolled.</p></div>`;
}

function render(tab){
  document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  $('#app').innerHTML=tab==='home'?myTeam():tab==='players'?players():tab==='fixtures'?fixtures():tab==='history'?history():tab==='prices'?prices():chips();
}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>render(b.dataset.tab));
$('#refresh').onclick=()=>load().catch(e=>{$('#sub').textContent='Data load error';$('#app').innerHTML=`<div class="card error"><b>Unable to load FPL data.</b><p>${esc(e.message)}</p><p class="muted">The cache is the official-data bridge for the Vercel app.</p></div>`});
load().catch(e=>{$('#sub').textContent='Data load error';$('#app').innerHTML=`<div class="card error"><b>Unable to load FPL data.</b><p>${esc(e.message)}</p><p class="muted">Check that the GitHub Actions cache has produced data/live.json.</p></div>`});
if('serviceWorker'in navigator) navigator.serviceWorker.register('/sw.js?v=8').catch(()=>{});
</script>
</body>
</html>

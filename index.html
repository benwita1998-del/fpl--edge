<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><title>FPL Edge</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1020;color:#f4f6fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1250px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.logo{font-size:26px;font-weight:900}.muted{color:#9da7bc}.tabs{display:flex;gap:8px;overflow:auto;margin:18px 0}.btn{border:1px solid #303a52;background:#151d31;color:#fff;border-radius:10px;padding:9px 12px;cursor:pointer}.btn.active{background:#fff;color:#101522}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#121a2b;border:1px solid #27324a;border-radius:14px;padding:15px}.wide{grid-column:1/-1}.label{font-size:12px;color:#8e9ab2;text-transform:uppercase;letter-spacing:.08em}.big{font-size:24px;font-weight:800;margin-top:5px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #27324a;white-space:nowrap;font-size:13px}.pill{padding:3px 7px;border-radius:999px;background:#24304a}.good{color:#7ee2a8}.bad{color:#ff8d9d}.warn{color:#ffd36e}.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #27324a}.hero{font-size:21px;font-weight:800}.move{display:inline-block;margin:3px 5px 3px 0;padding:5px 7px;background:#202a41;border-radius:8px}.footer{margin:20px 0;color:#75809a;font-size:12px}.error{border:1px solid #6b3440;background:#24141a}.ok{border:1px solid #285d46;background:#12251d}.loading{padding:30px;text-align:center}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:12px}th,td{font-size:12px;padding:7px}}
</style></head><body><div class="wrap">
<div class="top"><div><div class="logo">⚽ FPL Edge</div><div class="muted" id="sub">Connecting directly to official FPL data…</div></div><button class="btn" id="refresh">Refresh live data</button></div>
<div class="tabs"><button class="btn active" data-tab="home">Dashboard</button><button class="btn" data-tab="transfers">Transfers</button><button class="btn" data-tab="fixtures">Fixtures</button><button class="btn" data-tab="chips">Chips</button><button class="btn" data-tab="prices">Prices</button><button class="btn" data-tab="history">History</button></div>
<div id="app" class="loading">Loading official FPL data…</div><div class="footer">Live public data is read directly from the official Fantasy Premier League API. Recommendations are model projections, not guaranteed points.</div></div>
<script>
const TEAM_ID=702959, API='https://fantasy.premierleague.com/api';let D=null;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');const money=x=>`£${Number(x||0).toFixed(1)}m`;
async function get(path){const r=await fetch(API+path,{cache:'no-store',headers:{Accept:'application/json'}});const text=await r.text();if(!r.ok)throw new Error(`FPL ${r.status} on ${path}`);try{return JSON.parse(text)}catch{throw new Error(`Official FPL returned non-JSON on ${path}`)}}
function currentEvent(b){return b.events.find(e=>e.is_current)||b.events.find(e=>e.is_next)||b.events.find(e=>!e.finished)||b.events[0]}
function pos(t){return ({1:'GK',2:'DEF',3:'MID',4:'FWD'})[t]||'?'}
function fixture(f,teams){const home=f.team_h===f.team_h;const isHome=f.team_h===f.team_h;return f}
function next5(p,b,gw){return (b.fixtures||[]).filter(f=>f.event!=null&&f.event>=gw&&(f.team_h===p.team||f.team_a===p.team)).sort((a,b)=>a.event-b.event).slice(0,5).map(f=>{const h=f.team_h===p.team;const opp=b.teams.find(t=>t.id===(h?f.team_a:f.team_h));return {event:f.event,opponent:opp?.short_name||'TBC',home:h,fdr:h?f.team_h_difficulty:f.team_a_difficulty,kickoff:f.kickoff_time}})}
function ft(history,gw){let bank=0;for(const h of (history.current||[]).filter(x=>x.event<gw).sort((a,b)=>a.event-b.event)){const available=Math.min(5,bank+1);bank=Math.max(0,available-(h.event_transfers||0))}return Math.min(5,bank+1)}
function sell(now,paid){now=+now;paid=+paid;if(now<=paid)return paid;return +(paid+Math.floor(((now-paid)/2)*10+1e-9)/10).toFixed(1)}
async function load(){
  $('#sub').textContent='Loading FPL Edge data…';

  const r=await fetch('https://raw.githubusercontent.com/benwita1998-del/fpl-edge/refs/heads/fpl-cache/data/live.json?'+Date.now(),{cache:'no-store'});
  if(!r.ok) throw new Error(`FPL cache ${r.status}`);

  const j=await r.json();

  const b=j.bootstrap;
  const entry=j.entry;
  const history=j.history;
  const transfers=j.transfers||[];
  const gw=currentEvent(b);

  const picks=j.picks||{picks:[]};

  const teamMap=Object.fromEntries(b.teams.map(t=>[t.id,t]));
  const playerMap=Object.fromEntries(b.elements.map(p=>[p.id,p]));

  const squad=(picks.picks||[]).map(x=>{
    const p=playerMap[x.element];
    return {
      ...x,
      player:p,
      next5:next5(p,b,gw.id),
      selling:x.selling_price!=null
        ? x.selling_price/10
        : sell(p.now_cost/10,p.now_cost/10)
    };
  });

  const allPlayers=b.elements.map(p=>({
    id:p.id,
    name:p.web_name,
    team:teamMap[p.team]?.name||'',
    team_short:teamMap[p.team]?.short_name||'',
    position:pos(p.element_type),
    element_type:p.element_type,
    price:p.now_cost/10,
    points:p.total_points,
    form:p.form,
    ppg:p.points_per_game,
    ownership:p.selected_by_percent,
    xg:p.expected_goals,
    xa:p.expected_assists,
    minutes:p.minutes,
    status:p.status,
    news:p.news,
    chance:p.chance_of_playing_this_round,
    next5:next5(p,b,gw.id)
  }));

  D={
    b,
    gw,
    entry,
    history,
    transfers,
    picks,
    teamMap,
    playerMap,
    squad,
    allPlayers,
    freeTransfers:ft(history,gw.id)
  };

  $('#sub').textContent=`${entry.name} · GW${gw.id} · ${entry.player_first_name} ${entry.player_last_name}`;
  render('home');
}
}
function stats(){return `<div class="grid">${[['Overall rank',Number(D.entry.summary_overall_rank||0).toLocaleString()],['Points',D.entry.summary_overall_points],['Team value',money(D.entry.last_deadline_value/10)],['Bank',money(D.entry.last_deadline_bank/10)],['Free transfers',D.freeTransfers],['GW transfers',D.history.current?.find(x=>x.event===D.gw.id)?.event_transfers||0],['Squad',D.squad.length],['Chips used',D.history.chips?.length||0]].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="big">${x[1]}</div></div>`).join('')}</div>`}
function ftxt(f){return `<span class="pill">${f.home?'H':'A'} ${f.opponent} · FDR ${f.fdr}</span>`}
function dashboard(){const rows=D.squad.map(x=>`<tr><td><b>${esc(x.player.web_name)}</b><br><span class="muted">${pos(x.player.element_type)}${x.is_captain?' · C':''}${x.is_vice_captain?' · VC':''}</span></td><td>${D.teamMap[x.player.team]?.short_name||''}</td><td>${money(x.player.now_cost/10)}</td><td>${x.player.total_points}</td><td>${x.player.form}</td><td>${x.player.status==='a'?'<span class="good">Available</span>':'<span class="warn">'+esc(x.player.news||x.player.status)+'</span>'}</td><td>${x.next5.map(ftxt).join(' ')}</td></tr>`).join('');return stats()+`<div class="card wide" style="margin-top:12px"><div class="label">Your current squad · Team ${TEAM_ID}</div><div class="scroll"><table><thead><tr><th>Player</th><th>Club</th><th>Price</th><th>Pts</th><th>Form</th><th>Status</th><th>Next 5</th></tr></thead><tbody>${rows||'<tr><td colspan="7">Picks are not available for this GW yet.</td></tr>'}</tbody></table></div></div>`}
function score(p){const form=+p.form||0,ppg=+p.points_per_game||0,xgi=(+p.expected_goals||0)+(+p.expected_assists||0),mins=Math.min(1,(+p.minutes||0)/900),fx=p.next5.length?p.next5.reduce((s,f)=>s+(6-(+f.fdr||3)),0)/p.next5.length:3,av=p.status==='a'?1:p.status==='d'?(+p.chance_of_playing_next_round||50)/100:0;return +(form*.85+ppg*.5+xgi*1.15+fx*1.05+mins*1.4+av*1.5).toFixed(2)}
function transfers(){const owned=new Set(D.squad.map(x=>x.player.id));const plans=[];for(const outRow of D.squad){const candidates=D.allPlayers.filter(p=>p.element_type===outRow.player.element_type&&!owned.has(p.id)&&p.status==='a').map(p=>({...p,s:score(p)})).sort((a,b)=>b.s-score(outRow.player)).slice(0,5);for(const p of candidates){const delta=+(p.s-score(outRow.player)).toFixed(2);if(delta>0)plans.push({out:outRow.player.web_name,inn:p.name,price:p.price,delta})}}plans.sort((a,b)=>b.delta-a.delta);const best=plans[0];return `<div class="card"><div class="label">GW${D.gw.id} decision engine</div><div class="hero">${best?`Best immediate 1 FT: ${esc(best.out)} → ${esc(best.inn)}`:'Roll your transfer'}</div><p class="muted">${D.freeTransfers} free transfer${D.freeTransfers===1?'':'s'} available · model compares form, minutes, xG/xA and next-five fixtures.</p></div><div class="card" style="margin-top:12px"><div class="label">Top transfer ideas</div>${plans.slice(0,12).map(p=>`<div class="row"><span><b>${esc(p.out)}</b> → <b>${esc(p.inn)}</b></span><span class="good">+${p.delta} model</span></div>`).join('')}</div>`}
function fixtures(){const ps=[...D.allPlayers].sort((a,b)=>score(b)-score(a)).slice(0,50);return `<div class="card"><div class="label">Next-five model</div><div class="scroll"><table><thead><tr><th>Player</th><th>Club</th><th>Price</th><th>Model</th><th>Next 5</th></tr></thead><tbody>${ps.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.team_short}</td><td>${money(p.price)}</td><td><b>${score(p)}</b></td><td>${p.next5.map(ftxt).join(' ')}</td></tr>`).join('')}</tbody></table></div></div>`}
function chips(){const used=D.history.chips||[];const names=[['wildcard','Wildcard'],['freehit','Free Hit'],['bboost','Bench Boost'],['3xc','Triple Captain']];return `<div class="grid">${names.flatMap(([k,n])=>[1,2].map(h=>{const u=used.find(c=>c.name===k&&(h===1?c.event<=19:c.event>=20));return `<div class="card"><div class="label">${n} · half ${h}</div><div class="big">${u?`Used GW${u.event}`:'AVAILABLE'}</div></div>`})).join('')}</div><div class="card" style="margin-top:12px"><b>2026/27 chip rules</b><p class="muted">Two sets of Wildcard, Free Hit, Bench Boost and Triple Captain. First set before the GW19 deadline; second set from GW20. Only one chip per GW.</p></div>`}
function prices(){const movers=D.allPlayers.slice().sort((a,b)=>Math.abs((b.cost_change_event||0))<Math.abs((a.cost_change_event||0))?1:-1);return `<div class="card"><div class="label">Official FPL price engine</div><div class="row"><span>Current price source</span><b>Official FPL API</b></div><div class="row"><span>Confirmed GW move</span><b>cost_change_event</b></div><div class="row"><span>Season movement</span><b>cost_change_start</b></div><div class="row"><span>Price-change predictions</span><b>Use official predictor when exposed</b></div></div><div class="card" style="margin-top:12px"><div class="scroll"><table><thead><tr><th>Player</th><th>Price</th><th>GW move</th><th>Season move</th><th>Owner</th></tr></thead><tbody>${movers.slice(0,80).map(p=>`<tr><td>${esc(p.name)}</td><td>${money(p.price)}</td><td>${p.cost_change_event>0?'<span class="good">+':''}${p.cost_change_event?((p.cost_change_event>0?'+':'')+(p.cost_change_event/10).toFixed(1)+'m'):'—'}</td><td>${p.cost_change_start?((p.cost_change_start>0?'+':'')+(p.cost_change_start/10).toFixed(1)+'m'):'—'}</td><td>${p.ownership}%</td></tr>`).join('')}</tbody></table></div></div>`}
function history(){return `<div class="card"><div class="label">Season history</div><div class="scroll"><table><thead><tr><th>GW</th><th>Pts</th><th>Total</th><th>Rank</th><th>Transfers</th><th>Hit</th></tr></thead><tbody>${(D.history.current||[]).map(h=>`<tr><td>${h.event}</td><td>${h.points}</td><td>${h.total_points}</td><td>${Number(h.overall_rank||0).toLocaleString()}</td><td>${h.event_transfers}</td><td>${h.event_transfers_cost}</td></tr>`).join('')}</tbody></table></div></div>`}
function render(tab){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#app').innerHTML=tab==='home'?dashboard():tab==='transfers'?transfers():tab==='fixtures'?fixtures():tab==='chips'?chips():tab==='prices'?prices():history()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>render(b.dataset.tab));$('#refresh').onclick=()=>load().catch(e=>{$('#app').innerHTML=`<div class="card error"><b>Unable to load official FPL data.</b><p>${esc(e.message)}</p><p class="muted">If the FPL site is temporarily blocking the browser request, try Refresh live data again in a moment.</p></div>`});load().catch(e=>{$('#sub').textContent='FPL connection error';$('#app').innerHTML=`<div class="card error"><b>Unable to load official FPL data.</b><p>${esc(e.message)}</p><p class="muted">The app is online. The data request failed before any team data was loaded.</p></div>`});
if('serviceWorker'in navigator){navigator.serviceWorker.register('/sw.js?v=3').catch(()=>{})}
</script></body></html>
